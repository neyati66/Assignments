<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson — Quizzy</title>
<meta name="description" content="A detailed HTML lesson with explanations, code examples and notes." />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="./index.html"><i class="brand-mark">Q</i>Quiz<span>zy</span></a>
    <nav>
      <a href="./dashboard.html">Dashboard</a>
      <a class="active" href="./subjects.html">Subjects</a>
      <a href="./test-selection.html">Tests</a>
      <a href="./quiz.html">Quiz view</a>
      <a href="./result.html">Results &amp; review</a>
      <a href="./leaderboard.html">People</a>
      <a href="./profile.html">Profile</a>
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
      <a href="./login.html">Sign out</a>
    </nav>
  </aside>

  <main class="main">
    <p class="small muted" data-dynamic="lesson-breadcrumb" style="margin-bottom:14px">HTML Syllabus &rsaquo; Topic &rsaquo; Lesson</p>

    <div class="page-head">
      <div>
        <span class="pill" data-dynamic="lesson-eyebrow">Lesson</span>
        <h2 style="margin-top:12px" data-dynamic="lesson-title">Lesson title</h2>
      </div>
      <span class="tag sky" data-dynamic="lesson-progress-indicator">Lesson — of —</span>
    </div>

    <div class="progress" style="margin-bottom:24px"><i data-dynamic="lesson-progress-fill" style="width:0%"></i></div>

    <div class="course-layout">
      <section class="stack">
        <section class="card">
          <p data-dynamic="lesson-intro" style="margin-top:0"></p>
        </section>

        <section class="card">
          <h3>Key Points</h3>
          <ul class="stack small" style="margin-top:14px;padding-left:20px" data-dynamic="lesson-points"></ul>
        </section>

        <section class="card">
          <h3>💻 Code Example</h3>
          <div class="code-block" style="margin-top:14px" data-dynamic="lesson-code"></div>
        </section>

        <div class="why-note" data-dynamic="lesson-note"></div>

        <div class="row between" style="margin-top:8px">
          <button class="btn btn-ghost" type="button" data-dynamic="lesson-prev">&larr; Previous Lesson</button>
          <button class="btn btn-ghost" type="button" data-dynamic="lesson-next">Next Lesson &rarr;</button>
        </div>
      </section>

      <aside class="stack">
        <div class="card">
          <h3>This topic</h3>
          <div class="stack" style="margin-top:14px" data-dynamic="lesson-topic-list"></div>
        </div>

        <a class="btn btn-accent btn-block take-quiz-btn" href="./test-selection.html?subject=HTML" style="padding:18px">
          <span class="icon-chip" style="background:rgba(255,255,255,.18)">📝</span>
          <span style="text-align:left;flex:1">
            <b style="display:block;font-size:15px">Take Quiz</b>
            <span style="display:block;font-size:12px;opacity:.9;font-weight:600">Start the adaptive HTML quiz</span>
          </span>
        </a>
      </aside>
    </div>
  </main>
</div>
  <script src="./js/storage.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/questions.js"></script>
  <script src="./js/sm2.js"></script>
  <script src="./js/progress.js"></script>
  <script src="./js/learning.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/html-lesson.js"></script>
</body>
</html>
